<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BaaS RuleSet Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@latest/dist/jsoneditor.min.js"></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body { font-family: system-ui, sans-serif; background: #fafafa; margin: 1rem; }
    #layout { display: flex; gap: 1rem; }
    #ruleList { width: 30%; max-height: 80vh; overflow-y: auto; }
    #editor_holder { flex: 1; min-height: 80vh; background: white; padding: 1rem; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .rule-item { cursor: pointer; padding: 0.5rem; border-bottom: 1px solid #eee; }
    .rule-item:hover { background: #f0f8ff; }
    .rule-item.active { background: #dff0d8; font-weight: bold; }
  </style>
</head>
<body>
  <h2>BaaS RuleSet Editor</h2>

  <div class="mb-2">
    <select id="ruleSetSelect" class="form-select d-inline-block w-auto"></select>
    <button id="loadSetBtn" class="btn btn-primary btn-sm">Load RuleSet</button>
    <button id="saveSetBtn" class="btn btn-success btn-sm">Save All</button>
  </div>

  <div id="layout">
    <div id="ruleList" class="list-group"></div>
    <div id="editor_holder"></div>
  </div>

  <script src="./js/simple.js"></script>
</body>
</html>
